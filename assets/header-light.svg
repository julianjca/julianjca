<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <style>
    .t{fill:#1C1B19}.m{fill:#6B6862}.a{fill:#E5533D}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .in{animation:in .7s ease-out backwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}.d5{animation-delay:1.1s}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .dot{animation:pulse 2.4s ease-in-out infinite;transform-origin:44px 222px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  </style>
  <rect x="0.5" y="0.5" width="859" height="259" rx="14" fill="#FBFAF7" stroke="#E7E3DC"/>
  <g stroke="#E7E3DC" stroke-width="1"><line x1="40" y1="18" x2="40" y2="28"/><line x1="60" y1="18" x2="60" y2="23"/><line x1="80" y1="18" x2="80" y2="23"/><line x1="100" y1="18" x2="100" y2="23"/><line x1="120" y1="18" x2="120" y2="23"/><line x1="140" y1="18" x2="140" y2="28"/><line x1="160" y1="18" x2="160" y2="23"/><line x1="180" y1="18" x2="180" y2="23"/><line x1="200" y1="18" x2="200" y2="23"/><line x1="220" y1="18" x2="220" y2="23"/><line x1="240" y1="18" x2="240" y2="28"/><line x1="260" y1="18" x2="260" y2="23"/><line x1="280" y1="18" x2="280" y2="23"/><line x1="300" y1="18" x2="300" y2="23"/><line x1="320" y1="18" x2="320" y2="23"/><line x1="340" y1="18" x2="340" y2="28"/><line x1="360" y1="18" x2="360" y2="23"/><line x1="380" y1="18" x2="380" y2="23"/><line x1="400" y1="18" x2="400" y2="23"/><line x1="420" y1="18" x2="420" y2="23"/><line x1="440" y1="18" x2="440" y2="28"/><line x1="460" y1="18" x2="460" y2="23"/><line x1="480" y1="18" x2="480" y2="23"/><line x1="500" y1="18" x2="500" y2="23"/><line x1="520" y1="18" x2="520" y2="23"/><line x1="540" y1="18" x2="540" y2="28"/><line x1="560" y1="18" x2="560" y2="23"/><line x1="580" y1="18" x2="580" y2="23"/><line x1="600" y1="18" x2="600" y2="23"/><line x1="620" y1="18" x2="620" y2="23"/><line x1="640" y1="18" x2="640" y2="28"/><line x1="660" y1="18" x2="660" y2="23"/><line x1="680" y1="18" x2="680" y2="23"/><line x1="700" y1="18" x2="700" y2="23"/><line x1="720" y1="18" x2="720" y2="23"/><line x1="740" y1="18" x2="740" y2="28"/><line x1="760" y1="18" x2="760" y2="23"/><line x1="780" y1="18" x2="780" y2="23"/><line x1="800" y1="18" x2="800" y2="23"/><line x1="820" y1="18" x2="820" y2="23"/></g>
  <text x="40" y="62" font-size="13" letter-spacing="2" class="m in d1">JCA<tspan class="a">.</tspan>  ·  JAKARTA, JKT</text>
  <text x="38" y="122" font-size="46" class="t serif in d2">Hi, I’m Julian<tspan class="a">.</tspan></text>
  <text x="40" y="160" font-size="15" class="m in d3">I build software at <tspan class="t">Late Checkout</tspan>. Lately: reading Pirsig,</text>
  <text x="40" y="182" font-size="15" class="m in d3">losing weekends to Riftbound and OPTCG, and taking photos.</text>
  <line x1="40" y1="200" x2="820" y2="200" stroke="#E7E3DC" class="in d4"/>
  <g class="in d5">
    <circle cx="44" cy="222" r="4" class="a dot"/>
    <text x="58" y="227" font-size="13" class="m">today, from the desk <tspan class="t">→ building software at Late Checkout</tspan><tspan class="a cur"> ▍</tspan></text>
  </g>
</svg>
