name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E5533D&color_dots=#EBE7E0,#F4C6BC,#EE9A88,#E5533D,#B23A27
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF6B52&color_dots=#1E1D1B,#4A2A24,#7A3A2E,#C2493A,#FF6B52
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
